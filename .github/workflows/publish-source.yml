name: Expand Fenrir source archive
on:
  push:
    branches: [main]
    paths: ["fenrir-arch-source-0.3.0.part-*"]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble, verify and publish source tree
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          shopt -s nullglob
          parts=(fenrir-arch-source-0.3.0.part-*)
          test "\${#parts[@]}" -ge 2
          for i in "\${!parts[@]}"; do
            expected="fenrir-arch-source-0.3.0.part-$(printf '%02d' "$i")"
            test "\${parts[$i]}" = "$expected"
          done
          cat "\${parts[@]}" > "$tmp/archive.b64"
          base64 --decode "$tmp/archive.b64" > "$tmp/source.tar.xz"
          xz --test "$tmp/source.tar.xz"
          if tar -tJf "$tmp/source.tar.xz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path detected in source archive" >&2
            exit 1
          fi
          mkdir "$tmp/unpack"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp/unpack" --no-same-owner
          test -f "$tmp/unpack/install.sh"
          test -d "$tmp/unpack/scripts"
          (
            cd "$tmp/unpack"
            bash -n install.sh scripts/*.sh scripts/fenrir-enable-wol
            python -m compileall -q scripts tests
            python -m unittest discover -s tests -v
          )
          cp -a "$tmp/unpack/." .
          rm -f "\${parts[@]}" archive.b64 source.tar.xz fenrir-arch-source-0.3.0.tar.gz fenrir-arch-source-0.3.0.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already matches the validated archive"
            exit 0
          fi
          git commit -m "feat: publish complete Fenrir Arch source tree"
          git push
