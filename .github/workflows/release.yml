name: Release Fenrir Arch

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release source
        run: |
          bash -n install.sh scripts/*.sh scripts/fenrir-enable-wol
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Build source archive and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          git archive --format=tar.gz --prefix="fenrir-arch-${version}/" "$GITHUB_REF_NAME" > "release/fenrir-arch-${version}.tar.gz"
          sha256sum release/* > release/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
