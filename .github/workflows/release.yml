name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "VERSION"
      - "README.md"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Validate normalized versions and component pins
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]\.[0-9]\.[0-9]$ ]]
          python - <<'PY'
          import pathlib
          import tomllib
          version = pathlib.Path("VERSION").read_text().strip()
          readme = pathlib.Path("README.md").read_text()
          lock = tomllib.loads(pathlib.Path("components.lock").read_text())
          assert lock["arch_version"] == version
          assert f"**Version:** {version}" in readme
          for key in ("dots_commit", "catalog_commit"):
              value = lock[key]
              assert len(value) == 40 and all(c in "0123456789abcdef" for c in value)
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build source archive and checksums
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="fenrir-arch-${VERSION}/" HEAD > "dist/fenrir-arch-${VERSION}.tar.gz"
          printf '%s\n' "$VERSION" > dist/VERSION
          (
            cd dist
            sha256sum "fenrir-arch-${VERSION}.tar.gz" VERSION > SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/fenrir-arch-${{ steps.metadata.outputs.version }}.tar.gz

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable tag ${TAG}" >&2
            exit 1
          fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Fenrir-Arch ${VERSION}" \
            --generate-notes \
            --latest
