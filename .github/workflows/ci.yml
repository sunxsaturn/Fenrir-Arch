name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Fenrir-Dots companion source
        uses: actions/checkout@v4
        with:
          repository: sunxsaturn/Fenrir-Dots
          ref: 1fa6883e85829d268659dee6a248a842c1eae210
          path: companion/Fenrir-Dots
      - name: Checkout pinned Fenrir Wallpaper Catalog source
        uses: actions/checkout@v4
        with:
          repository: sunxsaturn/Fenrir-Wallpaper-Catalog
          ref: cd4dc6be4644042b121c515f540c563cef1b1114
          path: companion/Fenrir-Wallpaper-Catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate shell scripts
        run: bash -n install.sh scripts/*.sh scripts/fenrir-enable-wol
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run tests
        env:
          FENRIR_DOTS_CHECKOUT: companion/Fenrir-Dots
          FENRIR_CATALOG_CHECKOUT: companion/Fenrir-Wallpaper-Catalog
        run: python -m unittest discover -s tests -v
